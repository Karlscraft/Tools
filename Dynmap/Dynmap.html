<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karlscraft – Serverstatus</title>
<style>
  :root {
    --sheet: #0f1720;
    --ink: #cfe0ea;
    --ink-dim: #8195a6;
    --accent: #e8a33d;
    --offline: #a1584f;
    --line: rgba(207, 224, 234, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--sheet);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: 36px 32px 22px;
    border: 1px solid rgba(207, 224, 234, 0.18);
  }

  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 0 solid rgba(207, 224, 234, 0.5);
  }
  .corner.tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .corner.tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .stamp {
    text-align: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 26px;
  }
  .stamp .sep { color: var(--accent); margin: 0 8px; }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  #fan {
    width: 100%;
    max-width: 300px;
    height: auto;
    overflow: visible;
  }

  .fan-line, .fan-ring {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-linecap: round;
    transition: stroke 0.5s ease, opacity 0.5s ease;
    transition-delay: calc(var(--i, 0) * 35ms);
  }

  .hub { fill: var(--ink-dim); transition: fill 0.5s ease; }

  .stage.checking .fan-line,
  .stage.checking .fan-ring {
    animation: breathe 1.8s ease-in-out infinite;
    animation-delay: calc(var(--i, 0) * 60ms);
  }

  .stage.online .fan-line,
  .stage.online .fan-ring { stroke: var(--accent); opacity: 1; }
  .stage.online .hub { fill: var(--accent); }
  .stage.online #status-text { color: var(--accent); }

  .stage.offline .fan-line,
  .stage.offline .fan-ring { stroke: var(--offline); opacity: 0.6; }
  .stage.offline .hub { fill: var(--offline); }
  .stage.offline #status-text { color: var(--offline); }

  @keyframes breathe {
    0%, 100% { opacity: 0.22; }
    50% { opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fan-line, .fan-ring, .hub { transition: none; }
    .stage.checking .fan-line, .stage.checking .fan-ring { animation: none; opacity: 0.5; }
  }

  .readout { margin-top: 24px; }
  .status-line { font-size: 1.05rem; min-height: 1.4em; }

  #retry-btn {
    margin-top: 16px;
    background: transparent;
    border: 1px solid rgba(207, 224, 234, 0.3);
    color: var(--ink);
    font: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 9px 18px;
    cursor: pointer;
  }
  #retry-btn:hover { border-color: var(--accent); }
  #retry-btn:disabled { opacity: 0.35; cursor: default; }
  #retry-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hint { margin: 14px 0 0; font-size: 0.74rem; color: var(--ink-dim); }

  .titleblock {
    margin-top: 34px;
    padding-top: 14px;
    border-top: 1px solid rgba(207, 224, 234, 0.18);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .tb-row { display: flex; justify-content: space-between; padding: 2px 0; gap: 12px; }
  .tb-row span:first-child { color: var(--ink-dim); }
  .tb-row span:last-child { color: var(--ink); text-align: right; }

  .noscript { margin-top: 16px; font-size: 0.85rem; text-align: center; }
  .noscript a { color: var(--accent); }
</style>
</head>
<body>
  <div class="sheet">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <div class="stamp">KARLSCRAFT<span class="sep">·</span>SERVERSTATUS</div>

    <div class="stage checking">
      <svg id="fan" viewBox="0 0 300 190" aria-hidden="true"></svg>

      <div class="readout">
        <div class="status-line">
          <span id="status-text" aria-live="polite">Prüfe Verbindung …</span>
        </div>
        <button id="retry-btn" type="button">Erneut prüfen</button>
        <p class="hint">Diese Seite prüft automatisch alle 15 Sekunden erneut.</p>
      </div>
    </div>

    <div class="titleblock">
      <div class="tb-row"><span>Projekt</span><span>Karlscraft</span></div>
      <div class="tb-row"><span>Blatt</span><span>Serverstatus</span></div>
      <div class="tb-row"><span>Maßstab</span><span>1:1</span></div>
      <div class="tb-row"><span>Adresse</span><span>karlscraft.ddns.net</span></div>
    </div>

    <noscript>
      <p class="noscript">JavaScript ist deaktiviert. <a href="http://karlscraft.ddns.net:4711/">Direkt zur Karte →</a></p>
    </noscript>
  </div>

<script>
(function () {
  var TARGET_URL = "http://google.com/";
  // ↑ Auf "https://…" umstellen, sobald ein Reverse-Proxy mit Zertifikat
  //   vor der Dynmap steht (siehe Hinweis zur Mixed-Content-Regel).
  var TIMEOUT_MS = 4000;
  var RETRY_INTERVAL_MS = 15000;

  var svg = document.getElementById("fan");
  var stage = document.querySelector(".stage");
  var text = document.getElementById("status-text");
  var retryBtn = document.getElementById("retry-btn");
  var checking = false;

  // --- Fächergrafik: Karlsruhes strahlenförmiger Stadtgrundriss ---
  var NS = "http://www.w3.org/2000/svg";
  var cx = 150, cy = 14;
  var spreadDeg = 132;
  var lengths = [96, 122, 108, 132, 116, 138, 124, 136, 118, 130, 110, 120, 98];

  function toXY(angleDeg, radius) {
    var rad = (angleDeg * Math.PI) / 180;
    return [cx + Math.sin(rad) * radius, cy + Math.cos(rad) * radius];
  }

  lengths.forEach(function (len, i) {
    var angle = -spreadDeg / 2 + (spreadDeg / (lengths.length - 1)) * i;
    var end = toXY(angle, len);
    var line = document.createElementNS(NS, "line");
    line.setAttribute("class", "fan-line");
    line.setAttribute("x1", cx);
    line.setAttribute("y1", cy);
    line.setAttribute("x2", end[0].toFixed(1));
    line.setAttribute("y2", end[1].toFixed(1));
    line.style.setProperty("--i", String(i));
    svg.appendChild(line);
  });

  [70, 100].forEach(function (radius, ringIndex) {
    var steps = 20;
    var points = [];
    for (var s = 0; s <= steps; s++) {
      var angle = -spreadDeg / 2 + (spreadDeg / steps) * s;
      var p = toXY(angle, radius);
      points.push(p[0].toFixed(1) + "," + p[1].toFixed(1));
    }
    var poly = document.createElementNS(NS, "polyline");
    poly.setAttribute("class", "fan-ring");
    poly.setAttribute("points", points.join(" "));
    poly.style.setProperty("--i", String(lengths.length + ringIndex));
    svg.appendChild(poly);
  });

  var hub = document.createElementNS(NS, "circle");
  hub.setAttribute("class", "hub");
  hub.setAttribute("cx", cx);
  hub.setAttribute("cy", cy);
  hub.setAttribute("r", 4);
  svg.appendChild(hub);

  // --- Statusprüfung ---
  function setState(state, message) {
    stage.className = "stage " + state;
    text.textContent = message;
  }

  function checkServer() {
    if (checking) return;
    checking = true;
    retryBtn.disabled = true;
    setState("checking", "Prüfe Verbindung …");

    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);

    // no-cors: wir brauchen nur eine Netzwerkantwort, keine CORS-Header
    // auf der Dynmap-Seite.
    fetch(TARGET_URL, { mode: "no-cors", cache: "no-store", signal: controller.signal })
      .then(function () {
        clearTimeout(timer);
        setState("online", "Server ist online – du wirst weitergeleitet …");
        setTimeout(function () { window.location.href = TARGET_URL; }, 900);
      })
      .catch(function () {
        clearTimeout(timer);
        setState("offline", "Server ist offline.");
      })
      .finally(function () {
        checking = false;
        retryBtn.disabled = false;
      });
  }

  retryBtn.addEventListener("click", checkServer);
  checkServer();
  setInterval(checkServer, RETRY_INTERVAL_MS);
})();
</script>
</body>
</html>
